# 单臂 Piper 主从遥操作数据采集
#
# 上机顺序：
#   1) dry-run + 不做初始化，确认主臂读数、相机、UI、按键都正常
#        python -m lerobot.scripts.lerobot_record_piper \
#          --config_path examples/piper/record_piper.yaml \
#          --collection.dry_run=true --collection.init_mode=none
#   2) 单独验初始化：人握住主臂摆一个姿势，看从臂是不是平滑走过来（而不是弹过去）
#        ... --collection.init_mode=follower_to_leader
#   3) 正式采集（本文件默认）
#
# 按键：c 开始/继续 | space 暂停 | e 错误模式 | 1-9 子任务 | s 保存 | r 丢弃 | q/Esc 退出

# ── 机械臂 ─────────────────────────────────────────────────────────────
# 每个条目 = 一条「主臂 + 从臂」。写一条是单臂，写两条是双臂。
# CAN 口名以 `ip -br link show | grep can` 的实际输出为准：_l = leader，_f = follower
arms:
  - name: left
    leader_port: can_left_l
    follower_port: can_left_f
    max_takeover_delta_rad: 0.4
    use_calibrated_offsets: false
    require_calibration: false

    # 主臂重力补偿参数
    gravity_comp_tx_ratio: [0.55, 0.95, 0.98, 1.2, 1.2, 0.5]
    gravity_comp_base_rpy_deg: [0.0, 0.0, 0.0]
    gravity_comp_torque_limit: 8.0
    gravity_comp_mit_kp: 0.0
    gravity_comp_mit_kd: 0.0
    gravity_comp_control_hz: 200.0
    gravity_comp_urdf: assets/piper_description/urdf/piper_description.urdf
    gravity_comp_payload_mass: 0.0
    gravity_comp_payload_com: [0.0, 0.0, 0.0]

# ── 数据集 ─────────────────────────────────────────────────────────────
dataset:
  repo_id: user/PiperDemo
  root: /home/zzq/data/data_lerobot3/piper/PiperDemo
  task: "insert the connector"
  robot_type: piper
  fps: 30                     # 控制回路和数据集共用这一个频率

  resume: false                # true = 追加到已有数据集；false = 新建（会先问一遍再删）
  use_videos: true
  video_codec: h264_nvenc     # 没有 NVENC 就换 libsvtav1
  streaming_encoding: false
  encoder_threads: 4
  data_flush_every: 10        # 每 N 集把 parquet footer 落盘
  writer_queue_maxsize: 90

  subtasks:
    '1': 'grasp the connector.'
    '2': 'align it with the socket.'
    '3': 'insert and release.'

# ── 遥操作（从臂指令下发）──────────────────────────────────────────────
# 频率与 dataset.fps 无关：那是数据集帧率，这里才是控制频率。
# 位置模式下每条指令是一个位置阶跃，阶跃幅度正比于指令周期 —— 周期越短越接近
# 连续跟随，这就是「一顿一顿」的根治办法。由主臂新样本驱动，稳态约 188Hz。
teleop:
  enabled: true
  max_hz: 250.0
  idle_poll_s: 0.001
  # 关节速度上限。职责是兜住异常（主臂被撞、读数跳变），不是日常压抖。
  # 用 teleop_check 的 ratelimit_saturation_rate 校准：正常示教应接近 0。
  max_joint_vel_rad_s: 6.0
  # 指令允许领先实测位姿的最大量：从臂被卡住时防指令跑飞
  max_lead_rad: 0.5
  # CAN 内核过滤，只保留真正会读的报文 ID（从臂 5 个、主臂 11 个）。
  # 实测单臂 3200 -> 1000 帧/秒，直接减掉 SDK 解析线程的 GIL 占用。
  can_filters: true

# ── 采集 ───────────────────────────────────────────────────────────────
collection:
  max_timesteps: 10000
  use_back_event: true
  dry_run: false

  action_source: follower_next

  # follower_to_leader = 从臂运动到主臂当前位姿（人先握好主臂摆姿势）
  # home               = 主从各自平滑回原点
  init_mode: follower_to_leader
  init_duration_s: 2.0
  init_max_step_rad: 0.05
  init_settle_timeout_s: 10.0

# ── 相机 ───────────────────────────────────────────────────────────────
cameras:
  - {name: cam_top,  serial: "327122074756", width: 640, height: 480, fps: 60}
  - {name: cam_left, serial: "148522072680", width: 640, height: 480, fps: 60}

view:
  enabled: false
  max_width: 1280
  render_hz: 30

keyboard_backend: auto
