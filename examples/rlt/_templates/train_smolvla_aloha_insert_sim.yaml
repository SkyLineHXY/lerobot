# 在 ALOHA 插销仿真上微调 SmolVLA（SFT）。
#
#   CUDA_VISIBLE_DEVICES=0 python -m lerobot.scripts.lerobot_train \
#     --config_path examples/rlt/_templates/train_smolvla_aloha_insert_sim.yaml \
#     --policy.device=cuda --policy.push_to_hub=false
#
# 用 CUDA_VISIBLE_DEVICES 选卡，不要用 --policy.device=cuda:N：训练走 accelerate，
# 由它决定设备，policy.device 会被忽略，结果仍然分配到 0 号卡。
#
# 断点续训：
#   python -m lerobot.scripts.lerobot_train \
#     --config_path outputs/train/smolvla_sft_aloha_sim_insertion_human/checkpoints/last/pretrained_model/train_config.json \
#     --resume=true

policy:
  type: smolvla
  pretrained_path: lerobot/smolvla_base
  chunk_size: 50
  n_action_steps: 30
  max_state_dim: 32
  max_action_dim: 32
  vlm_model_name: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
  load_vlm_weights: true
  freeze_vision_encoder: false
  train_expert_only: false
  num_steps: 10

dataset:
  repo_id: lerobot/aloha_sim_insertion_human
  root: null
  video_backend: pyav
  use_imagenet_stats: false

env:
  type: aloha
  task: AlohaInsertion-v0
  fps: 50
  episode_length: 400
  obs_type: pixels_agent_pos
  observation_height: 480
  observation_width: 640
  render_mode: rgb_array

output_dir: outputs/train/smolvla_sft_aloha_sim_insertion_human_20260816
job_name: smolvla_sft_aloha_sim_insertion_human_20260816
seed: 1000

steps: 40000
batch_size: 8
num_workers: 8

log_freq: 100
save_freq: 5000
save_checkpoint: true
eval_freq: 5000
eval:
  n_episodes: 10
  batch_size: 5
  use_async_envs: false

wandb:
  enable: false
  project: lerobot_rlt
