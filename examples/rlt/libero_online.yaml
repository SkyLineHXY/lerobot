# 阶段 2：LIBERO 仿真在线 RL（L2 —— 上真机前的完整闭环验证）
#
#   python -m lerobot.rlt.train_online --config_path examples/rlt/libero_online.yaml
#
# 跑的是和真机完全相同的代码路径：归一化边界、VLA 参考采样、RL token 提取、
# stride 下采样、异步 learner。区别只是没有机械臂可损坏、没有人在回路。
# 判据：warmup 结束后 success20 应显著高于 warmup 期的基线。
#
# 依赖：pip install -e ".[libero]"

rl_token: outputs/rl_token
checkpoint: lerobot/smolvla_base
out: outputs/rlt_online_libero
device: cuda
seed: 0

env:
  type: libero
  suite: libero_10
  task_id: 0
  # LIBERO 的原生动作空间是 6 维 EE 增量 + 1 维夹爪，与论文的 delta 动作空间一致
  control_mode: relative
  observation_size: 256
  camera_name: agentview_image,robot0_eye_in_hand_image
  max_episode_steps: 400

rl:
  ac:
    chunk_len: 10             # 论文 C=10
    action_dim: 7             # 6 维 EE delta + 夹爪
    # LiberoProcessorStep 产出的扁平状态：eef 位置(3) + 轴角(3) + 夹爪 qpos(2)
    proprio_dim: 8
    hidden_dim: 256
    n_layers: 2
    action_std: 0.05
    ref_dropout: 0.5
    max_residual: 0.3
  discount: 0.99
  bc_beta: 0.3
  utd: 5
  batch_size: 256
  warmup_env_steps: 2000      # N_warm：先用 base VLA 预填 buffer
  total_env_steps: 100000

critical_phase: false         # 仿真里没有操作员按 `r`，全程由 RL policy 接管
log_freq: 500
save_freq: 5000
