# 阶段 2：mock 环境冒烟测试（L1）
#
#   python -m lerobot.rlt.train_online --config_path examples/rlt/mock_online.yaml
#
# 注意：mock 环境的奖励只依赖 6 维状态的前 2 维，且动作空间未归一化。它只能验证
# 「不崩、能跑、learner 线程正常」，不能作为算法有效性的证据 —— 那要看 LIBERO。

rl_token: outputs/rl_token
checkpoint: lerobot/smolvla_base
out: outputs/rlt_online_mock
device: cuda
seed: 0

env:
  type: mock
  max_episode_steps: 120
  image_size: 256
  success_eps: 0.15
  prompt: reach the target

rl:
  ac:
    chunk_len: 10
    action_dim: 6
    proprio_dim: 6
    hidden_dim: 256
    n_layers: 2
    action_std: 0.05
    ref_dropout: 0.5
    max_residual: 0.3
  bc_beta: 0.3
  utd: 5
  batch_size: 256
  warmup_env_steps: 400
  total_env_steps: 2000

log_freq: 200
save_freq: 2000
