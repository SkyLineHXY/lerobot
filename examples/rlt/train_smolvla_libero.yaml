# 在 LIBERO 上微调 SmolVLA —— 产出的权重就是 RLT stage-1/stage-2 的基座 VLA。
#
#   python -m lerobot.scripts.lerobot_train \
#     --config_path examples/rlt/train_smolvla_libero.yaml \
#     --policy.device=cuda:1 --policy.push_to_hub=false
policy:
  type: smolvla
  pretrained_path: lerobot/smolvla_base
  chunk_size: 50
  n_action_steps: 30
  max_state_dim: 32
  max_action_dim: 32
  vlm_model_name: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
  load_vlm_weights: true

  freeze_vision_encoder: true
  train_expert_only: false
  num_steps: 10

dataset:
  # LeRobot 的 libero_* 数据集特征布局都是 observation.images.image +
  # observation.images.wrist_image + observation.state(8) + action(7)；下面 env 的
  # camera_name_mapping 就是照着这两个图像键写的。
  # 本地已下载的是 $HF_LEROBOT_HOME/lerobot/libero_10（379 集 / 101469 帧 / 10 个任务）。
  repo_id: lerobot/libero_goal
  root: null
  video_backend: pyav
  use_imagenet_stats: false

# 训练中的仿真评估。camera_name_mapping 是关键：LIBERO 原始相机名要映射到本数据集
# 的图像键，否则腕部相机会被映射成 image2，而策略只认 wrist_image，会被静默丢掉一路
# 相机（现在 check_env_policy_image_keys 会直接报错，不再静默）。
# task 必须和 dataset.repo_id 的 suite 一致，否则评的是另一批任务。
env:
  type: libero
  task: libero_goal
  camera_name: agentview_image,robot0_eye_in_hand_image
  camera_name_mapping:
    agentview_image: image
    robot0_eye_in_hand_image: wrist_image
  obs_type: pixels_agent_pos
  observation_height: 256
  observation_width: 256
  # 只评前两个任务：一次完整 rollout 要跑几百步仿真 + 策略前向，全 suite 评一轮
  # 比训练本身还慢。想看全量成功率就删掉 task_ids，用 lerobot-eval 单独跑。
  task_ids: [0, 1]
  max_parallel_tasks: 1

output_dir: outputs/train/smolvla_libero_10
job_name: smolvla_libero_10
seed: 1000

steps: 40000
batch_size: 8
num_workers: 8

log_freq: 100
save_freq: 5000
save_checkpoint: true
eval_freq: 5000
eval:
  n_episodes: 10
  batch_size: 5
  use_async_envs: false

wandb:
  enable: false
  project: lerobot_rlt
