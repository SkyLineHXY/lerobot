rl_token: /home/zzq/lerobot/outputs/train/rl_token/insertion_sft050000_20260824
checkpoint: /home/zzq/lerobot/outputs/train/smolvla_sft_insertion_demo_20260823/checkpoints/050000/pretrained_model
out: /home/zzq/lerobot/outputs/rl_token/rlt_online_insertion_20260824
device: cuda
seed: 0

concurrency:
  mode: processes
  learner_host: 127.0.0.1
  learner_port: 50061
  parameters_push_hz: 10.0
  max_pending_ops: 4096
  learner_torch_threads: 1

env:
  type: insertion
  task_stage: pregrasped      # 初始已夹持；full 是先抓后插，长程得多
  prompt: insert the red bar into the blue slot
  control_mode: relative
  control_freq: 20
  observation_size: 256
  camera_name: agentview_image,robot0_eye_in_hand_image
  # 与 4_online.yaml / 5_eval_online.yaml 同一视界。400 是 OnlineRLConfig 的默认值，
  # 不是为这个任务选的：专家均值 76 步，400 步的失败 episode 会往 buffer 里塞 200 行
  # 全零奖励，并把终局奖励推到 40 个 chunk hop 之外（gamma^C=0.904，gamma^(40C)≈0.02）。
  max_episode_steps: 250
  init_state_offset: 0
  n_init_states: 30
  pool_size: 50
  pool_seed: 0
  task_kwargs: {}
  teleop:
    device: gamepad
    use_rotation: true        # 7 维 delta EE，需要手腕三轴
    # 摇杆按 TCP（末端）系解释：delta_z 沿工具接近轴 = 插入深度，左摇杆是垂直于
    # 杆的横向修正，右摇杆是绕工具轴的倾斜/自转。手腕转过之后仍然一一对应，
    # base 系下则要在脑子里换算。存进 buffer 的仍是转换回 base 系的动作。
    frame: tcp                # base | tcp
    position_scale: 0.25
    rotation_scale: 0.1
    gamepad_deadzone: 0.1
    gamepad_bindings: {}
    use_device_events: true   # 接管/成功/失败也认手柄按键
rl:
  ac:
    chunk_len: 10
    action_dim: 7
    proprio_dim: 8
    hidden_dim: 256
    n_layers: 2
    action_std: 0.05
    ref_dropout: 0.5
    # 论文/openpi-RLT：直接吐完整 chunk。有界残差与 ref_dropout 不兼容——参考被置零的
    # 那一半行上 mu 被夹在 ±scale 内，而 BC 目标是完整幅度的 ref，永远够不着。
    residual_scale: 0.0

  discount: 0.99
  warmup_bc_weight: 10.0
  warmup_q_weight: 0.1

  online_bc_weight: 5.0
  online_q_weight: 0.1
  # 一步切换 BC/Q 权重会让 actor_ref_dist 在 500 个梯度步里从 0.14 跳到 0.39。
  weight_ramp_updates: 20000
  awr_weight: 0
  human_bc_weight: 1.0

  critic_mc_weight: 0
  utd: 5
  batch_size: 256
  sample_strategy: stratified
  truncation_is_failure: true
  warmup_env_steps: 8000
  # 交接前 learner 还必须跑够这么多梯度步（openpi-RLT tasks/agilex_ethernet 的取值）。
  warmup_post_collect_updates: 20000
  total_env_steps: 100000

wandb:
  # critic 探针（q_reward_gap / q_vs_mc / q_mc_corr / buffer_mc_mean）终端只挑着打印，
  # 完整的一套只走 wandb。offline 无网也能存，事后 wandb sync。
  enable: true
  project: lerobot_rlt
  mode: offline               # online | offline | disabled
  diagnostics_every: 100

critical_phase: false
log_freq: 500
save_freq: 5000


view:
  enabled: true             # 相机画面 + RL 状态面板；没有 DISPLAY 时自动降级成空操作
  max_width: 960
  panel_height: 200
  tile_height: 320
  min_period_s: 0.0         # 每个 env step 都重画；仿真跑太快时可以设 0.05 限帧
