# 遥操作链路验证（上机第 0 步）—— 不训练、不加载 VLA、不写数据集
#
# 目的：在跑 train_online.py 之前，单独确认
#   1) 重力补偿主臂 -> 跟随臂这条链路能不能稳定跑到 control_hz
#   2) 键名映射 / 限速 / 按键语义 / 主从对齐这套流程是不是对的
#
# 建议顺序：
#   a) 先 dry-run，只读不下发，确认主臂读数正常、耗时在预算内
#        python -m lerobot.rlt.teleop_check --config_path examples/rlt/teleop_check.yaml \
#          --dry_run=true
#   b) 关掉相机，单独看机械臂 CAN 链路的极限
#        ... --use_cameras=false
#   c) 打开相机做真实跟随（本文件默认），按空格握住主臂拖动 20~30 秒
#   d) 带上阶段 1 输出，连带验证归一化边界
#        ... --rl_token=outputs/rl_token
#
# 操作员按键（与 train_online.py 完全一致）：
#   空格 握住/交还主臂   s 成功   f 失败   ← 打标记   Esc 结束

can_port: can_left_f

leader:
  port: can_left_l
  id: piper_leader
  # 干预动作必须与阶段 1 数据集的绝对关节角空间一致，默认读绝对值而非标定偏移
  use_calibrated_offsets: false
  # 验证脚本默认不强制标定，避免连上就掉进交互式标定流程
  require_calibration: false
  # 接管瞬间主从关节差的上限，超过就拒绝释放主臂并重新对齐
  max_takeover_delta_rad: 0.15

  # ---- 重力补偿 ----
  gravity_comp_tx_ratio: [0.55, 0.95, 1.05, 1.2, 1.2, 0.5]
  gravity_comp_base_rpy_deg: [0.0, 0.0, 0.0]
  gravity_comp_torque_limit: 8.0
  gravity_comp_mit_kp: 0.0
  gravity_comp_mit_kd: 0.0
  gravity_comp_control_hz: 200.0

  # ---- 末端负载（这一项漏了会直接表现为"腕部没有重力补偿"）----
  # 内置 URDF 腕部什么都不带（link6 仅 0.007 kg）。主臂末端若装了夹爪 / 示教手柄 /
  # 相机，模型算出的腕部重力矩会被系统性低估 —— 实测装夹爪后 J4/J5 的真实需求是
  # 无负载模型的约 3.9 倍（0.218 -> 0.846 N·m）。
  # ⚠ 这种偏差**调 tx_ratio 补不回来**：缩放的是一个本身就错的 g(q)，只能在某一个
  #   位姿上凑对，换个姿态又不对，因为负载的力臂随构型变化。
  #
  # 二选一：
  # (A) 换成含夹爪的 URDF（仓库里现成就有）
  #     gravity_comp_urdf: assets/piper_description/urdf/piper_description.urdf
  # (B) 把负载按质点并进模型（示教器未必等于标准夹爪，这条更灵活）
  #     gravity_comp_payload_mass: 0.5            # kg，称一下实际重量
  #     gravity_comp_payload_com: [0.0, 0.0, 0.05]  # m，质心相对 joint6 坐标系
  # 两条等价性已验证：0.5kg@0.05m 与含夹爪 URDF 结果几乎重合（J4: 0.907 vs 0.846）。
  gravity_comp_urdf: null
  gravity_comp_payload_mass: 0.0
  gravity_comp_payload_com: [0.0, 0.0, 0.0]

control_hz: 30.0
duration_s: 30.0
# 与 piper_online.yaml 保持一致，否则测出来的限速余量没有参考价值
max_joint_step_rad: 0.5

# 相机是控制回路里最贵的一环，必须计入实时性预算。
# 留空则沿用 PIPERConfig 自带的相机；改 use_cameras 可整体关掉。
use_cameras: true
cameras: []

keyboard_backend: auto

dry_run: false
# 一启动就进接管态（不用按空格）。IDE 里调试、或按键不可用时很有用。
engage_on_start: false
# 对齐后等主臂真正走到跟随臂位姿的时间上限。send_feedback 的 JointCtrl 是异步的，
# 不等就按空格会被接管安全门拒掉，现象是「按了空格主臂没松开」。
align_settle_s: 2.0

# 给了就额外验证「人的关节读数 -> 归一化 -> 反归一化」能否原样回来
rl_token: null
device: cpu

out: outputs/teleop_check
