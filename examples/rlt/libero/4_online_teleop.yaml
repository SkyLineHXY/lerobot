# 阶段 2：LIBERO 仿真在线 RL + 人工示教纠正
#
#   python -m lerobot.rlt.train_online --config_path examples/rlt/libero/4_online_teleop.yaml
#
# 在 libero_online.yaml 的基础上加了人在回路：训练途中按空格接管，用键盘或手柄
# 把机械臂推回正轨。buffer 保留部署时会看到的 VLA 参考作为 actor 条件输入，并把
# 实际执行的人类动作单独作为 HUMAN 步的 BC target；这样既学习纠正，也不制造输入偏移。
#
# 算子键（与真机完全一致）：
#   space  切换接管
#   s      标记本 episode 成功（唯一的奖励来源）
#   f      标记失败并结束
#   退格   丢弃本 episode 已采的所有 transition
#   Esc    结束训练
#
# 键盘遥操作键位（device: keyboard）：
#   方向键     xy 平面
#   Shift/右Shift  z 轴
#   u/o i/k j/l    roll / pitch / yaw
#   左Ctrl/右Ctrl  夹爪开合
#
# 注意 discard_key 必须改掉：键盘遥操作用方向键，与默认的 left=丢弃冲突。
#
# 依赖：pip install -e ".[libero]"；键盘/手柄后端需要图形界面（pynput / pygame）。

rl_token: outputs/rl_token
checkpoint: lerobot/smolvla_base
out: outputs/rlt_online_libero_teleop
device: cuda
seed: 0

env:
  type: libero
  suite: libero_10
  task_id: 0
  control_mode: relative
  observation_size: 256
  camera_name: agentview_image,robot0_eye_in_hand_image
  max_episode_steps: 400
  teleop:
    device: keyboard          # keyboard / gamepad / spacemouse
    use_rotation: true        # LIBERO 是 7 维 delta EE，需要手腕三轴
    # 设备输出和 LIBERO 动作空间都是 [-1, 1]，所以这两个纯粹是增益。
    # 想在物体附近做精细纠正就调小。
    position_scale: 0.3
    rotation_scale: 0.2

rl:
  ac:
    chunk_len: 10
    action_dim: 7
    proprio_dim: 8
    hidden_dim: 256
    n_layers: 2
    action_std: 0.05
    ref_dropout: 0.5
  discount: 0.99
  # openpi-RLT 的 actor loss：bc_w * mean((a - bc_target)^2) - q_w * mean(Q1)。
  # BC 项是 C*d 上的均值，所以这几个权重比 sum 口径的 beta 大约 C*d 倍。
  # 数值取自 openpi-RLT 实机任务 configs/tasks/agilex_ethernet/online_rl.yaml。
  warmup_bc_weight: 10.0
  warmup_q_weight: 0.1
  online_bc_weight: 5.0
  online_q_weight: 0.1
  utd: 5
  batch_size: 256
  warmup_env_steps: 2000
  total_env_steps: 100000

# 有人在回路时才有意义：episode 先跑 base VLA，操作员按 r 把控制权交给 RL policy
wandb:
  enable: true
  project: lerobot_rlt
  # run_name: null            # 默认用 wandb 自动生成的名字
  # run_id: null              # 填上旧 run id 可以把中断的训练续到同一条曲线
  mode: online                # online | offline | disabled
  # 每多少个梯度步跑一次诊断探针（额外几次 critic 前向）。曲线的价值主要来自它们，
  # 但不是免费的，所以走比 loss 更慢的时钟。
  diagnostics_every: 100

critical_phase: false
keyboard_backend: auto
discard_key: backspace
log_freq: 500
save_freq: 5000
