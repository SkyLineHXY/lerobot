# 阶段 2：LIBERO 仿真在线 RL（L2 —— 上真机前的完整闭环验证）
#
#   python -m lerobot.rlt.train_online --config_path examples/rlt/libero/4_online.yaml
#
# 跑的是和真机完全相同的代码路径：归一化边界、VLA 参考采样、RL token 提取、
# stride 下采样、异步 learner。区别只是没有机械臂可损坏、没有人在回路。
# 判据：warmup 结束后 success20 应显著高于 warmup 期的基线。
#
# 依赖：pip install -e ".[libero]"

rl_token: outputs/rl_token
checkpoint: lerobot/smolvla_base
out: outputs/rlt_online_libero
device: cuda
seed: 0

env:
  type: libero
  suite: libero_10
  task_id: 0
  # LIBERO 的原生动作空间是 6 维 EE 增量 + 1 维夹爪，与论文的 delta 动作空间一致
  control_mode: relative
  observation_size: 256
  camera_name: agentview_image,robot0_eye_in_hand_image
  max_episode_steps: 400

rl:
  ac:
    chunk_len: 10             # 论文 C=10
    action_dim: 7             # 6 维 EE delta + 夹爪
    # LiberoProcessorStep 产出的扁平状态：eef 位置(3) + 轴角(3) + 夹爪 qpos(2)
    proprio_dim: 8
    hidden_dim: 256
    n_layers: 2
    action_std: 0.05
    ref_dropout: 0.5
  discount: 0.99
  # openpi-RLT 的 actor loss：bc_w * mean((a - bc_target)^2) - q_w * mean(Q1)。
  # BC 项是 C*d 上的均值，所以这几个权重比 sum 口径的 beta 大约 C*d 倍。
  # 数值取自 openpi-RLT 实机任务 configs/tasks/agilex_ethernet/online_rl.yaml。
  warmup_bc_weight: 10.0
  warmup_q_weight: 0.1
  online_bc_weight: 5.0
  online_q_weight: 0.1
  utd: 5
  batch_size: 256
  warmup_env_steps: 2000      # N_warm：先用 base VLA 预填 buffer
  total_env_steps: 100000

wandb:
  enable: true
  project: lerobot_rlt
  # run_name: null            # 默认用 wandb 自动生成的名字
  # run_id: null              # 填上旧 run id 可以把中断的训练续到同一条曲线
  mode: online                # online | offline | disabled
  # 每多少个梯度步跑一次诊断探针（额外几次 critic 前向）。曲线的价值主要来自它们，
  # 但不是免费的，所以走比 loss 更慢的时钟。
  diagnostics_every: 100

critical_phase: false         # 仿真里没有操作员按 `r`，全程由 RL policy 接管
log_freq: 500
save_freq: 5000
