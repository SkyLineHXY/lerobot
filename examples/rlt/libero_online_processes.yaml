# 阶段 2：LIBERO 在线 RL，learner 跑在独立进程里（gRPC）
#
#   python -m lerobot.rlt.train_online --config_path examples/rlt/libero_online_processes.yaml
#
# 与 libero_online.yaml 的唯一区别是 concurrency.mode=processes：rollout 进程持
# VLA + env + 遥操作，learner 进程持 replay buffer + actor/critic，transition 流式
# 上行、actor 权重流式下行。
#
# 这样能消掉两件事：GIL 争用，以及 learner 每步 .item() 抽干共享 CUDA 默认流。
# **消不掉 GPU 算力争用**——两个进程照样时间片共享 SM，所以 rl 里的突发上限依旧有用。
#
# 线程版（mode=threads，默认）是对照基线。RL 上一旦出问题，"进程版有权重陈旧 bug"
# 和"这个任务本来就难"从曲线上分不开，所以先用线程版跑出可用结果再切过来。
#
# 依赖：pip install -e ".[async]"（grpcio）

rl_token: outputs/rl_token
checkpoint: lerobot/smolvla_base
out: outputs/rlt_online_libero_mp
device: cuda
seed: 0

concurrency:
  mode: processes
  learner_host: 127.0.0.1
  learner_port: 50061
  # rollout 只在 chunk 边界读权重，推得比这更勤是白费带宽
  parameters_push_hz: 10.0
  max_pending_ops: 4096
  # actor-critic 是 2 层 MLP，torch 默认按核数开 intra-op 线程，同步开销远大于收益：
  # 实测 48 线程 6.7 updates/s，1 线程 163 updates/s。顺带也不会把核占满饿死 rollout。
  learner_torch_threads: 1

env:
  type: libero
  suite: libero_10
  task_id: 0
  control_mode: relative
  observation_size: 256
  camera_name: agentview_image,robot0_eye_in_hand_image
  max_episode_steps: 400

rl:
  ac:
    chunk_len: 10
    action_dim: 7
    proprio_dim: 8
    hidden_dim: 256
    n_layers: 2
    action_std: 0.05
    ref_dropout: 0.5
    max_residual: 0.3
  discount: 0.97
  bc_beta: 0.3
  utd: 5
  batch_size: 256
  warmup_env_steps: 2000
  total_env_steps: 100000

critical_phase: false
log_freq: 500
save_freq: 5000
