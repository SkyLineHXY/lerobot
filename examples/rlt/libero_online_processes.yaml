# 阶段 2：LIBERO 在线 RL，learner 跑在独立进程里（gRPC）
#
#   python -m lerobot.rlt.train_online --config_path examples/rlt/libero_online_processes.yaml
#
# 与 libero_online.yaml 的唯一区别是 concurrency.mode=processes：rollout 进程持
# VLA + env + 遥操作，learner 进程持 replay buffer + actor/critic，transition 流式
# 上行、actor 权重流式下行。
# 这样能消掉两件事：GIL 争用，以及 learner 每步 .item() 抽干共享 CUDA 默认流。
# **消不掉 GPU 算力争用**——两个进程照样时间片共享 SM，所以 rl 里的突发上限依旧有用。
#
# 依赖：pip install -e ".[async]"（grpcio）

rl_token: /home/zzq/lerobot/outputs/train/rl_token/libero_goal
checkpoint: /home/zzq/lerobot/outputs/train/smolvla_sft_libero_goal_20260816/checkpoints/010000/pretrained_model
out: /home/zzq/lerobot/outputs/rlt_online_libero_goal_20260817
device: cuda
seed: 0

concurrency:
  mode: processes
  learner_host: 127.0.0.1
  learner_port: 50061
  # rollout 只在 chunk 边界读权重，推得比这更勤是白费带宽
  parameters_push_hz: 10.0
  max_pending_ops: 4096
  learner_torch_threads: 1

env:
  type: libero
  suite: libero_goal
  task_id: 0
  control_mode: relative
  observation_size: 256
  camera_name: agentview_image,robot0_eye_in_hand_image
  max_episode_steps: 400

rl:
  ac:
    chunk_len: 10
    action_dim: 7
    proprio_dim: 8
    hidden_dim: 256
    n_layers: 2
    action_std: 0.05
    ref_dropout: 0.5
    max_residual: 0.3
  discount: 0.99
  bc_beta: 0.3
  utd: 5
  batch_size: 256
  warmup_env_steps: 2000
  total_env_steps: 100000

critical_phase: false
log_freq: 500
save_freq: 5000
warmup_human_control: false


view:
  enabled: true             # 相机画面 + RL 状态面板；没有 DISPLAY 时自动降级成空操作
  max_width: 960
  panel_height: 200
  tile_height: 320
  min_period_s: 0.0         # 每个 env step 都重画；仿真跑太快时可以设 0.05 限帧
