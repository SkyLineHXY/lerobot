# 阶段 2：真实 Piper 机械臂 + human-in-the-loop 在线 RL（L3）
#
# 上机顺序不可跳级：
#   1) 主臂遥操作单独验证（lerobot-teleoperate，piper_leader -> piper）
#   2) dry-run：只跑观测→推理→反归一化→限幅，不下发动作
#        python -m lerobot.rlt.train_online --config_path examples/rlt/piper/online.yaml \
#          --env.dry_run=true
#   3) warmup-only：把 warmup_env_steps 设成等于 total_env_steps，只跑 base VLA
#   4) 正式在线 RL（本文件默认）
#
# 第 3 步不能省。actor 直接输出整条 chunk（不再是叠在 VLA 参考上的残差），所以第一次
# 交给它控制时输出并不等于 base VLA，只有 warmup 攒够数据、BC 项把它拉到参考附近之后
# 才安全。
#
# 操作员按键：
#   s 成功(+1,结束)  f 失败(0,结束)  r 交接给 RL policy  空格 切换主臂干预
#   ← 丢弃当前 episode   Esc 停止训练
#
# 依赖：pip install -e ".[piper,smolvla]"

rl_token: outputs/rl_token          # 必须是用 Piper 自己的演示数据训出来的
checkpoint: outputs/vla_ft          # 在 Piper 数据上微调过的 SmolVLA
out: outputs/rlt_online_piper
device: cuda
seed: 0

env:
  type: piper
  can_port: can0
  task: "insert the connector"      # 与阶段 1 数据集里的任务描述保持一致
  # 只是"多久采一次观测、换一次目标"，不再是从臂被下发的频率。
  control_hz: 30.0

  # 下发线程：位置模式下每条指令都是一个位置阶跃，阶跃幅度正比于指令周期。
  # 把下发从 control_hz 解耦出来之后，chunk 边界上主线程去跑 VLA 的那段时间里
  # 从臂仍在被喂指令 —— 这就是"接管时边界卡顿"的根治办法。
  # 接管期间由主臂自己的反馈时间戳驱动，实测稳态约 188Hz。
  stream_hz: 250.0            # 兜底上限，防止反馈异常高频灌满 CAN
  idle_poll_s: 0.001          # 没有新样本时的轮询间隔
  # 关节速度上限（rad/s），锚在上一条指令上。职责是兜住异常（主臂被撞、读数跳变），
  # 日常压抖交给高频小阶跃。旧的 max_joint_step_rad=0.05 @30Hz 等效 1.25~1.5 rad/s，
  # 正常示教就持续饱和 —— 那是设计出来的滞后，不是安全裕度。
  max_joint_vel_rad_s: 6.0
  max_lead_rad: 0.5           # 从臂被卡住时，指令允许领先实测的最大量
  # 关节死区保持 0：它是拿"本次目标 vs 上次已下发目标"比的，高频下会把慢速连续
  # 运动量化成台阶，恰好毁掉慢速精细操作的手感。
  joint_deadband_rad: 0.0
  gripper_deadband: 200       # 1e-6 m，200 = 0.2mm
  mode_refresh_interval_s: 1.0
  move_speed_ratio: 60        # 不上 MIT 阻抗时唯一的柔顺度旋钮，值得上机对比 40/60/80
  # 复位位姿；null 表示用 PIPERConfig.home_position
  reset_pose: null
  # 论文的 "slightly randomized set of initial configurations"
  reset_noise_rad: 0.02
  max_episode_steps: 400
  dry_run: false

  # 留空则沿用 PIPERConfig 自带的 RealSense 默认相机。
  # 相机集合必须和 VLA 微调时用的完全一致。
  cameras: []
  # 示例：
  # cameras:
  #   - name: cam_left
  #     serial: "148522072680"
  #   - name: cam_top
  #     serial: "327122074756"

  # 主臂遥操作干预；置为 null 则只有稀疏成功标签、没有动作干预
  teleop:
    port: can1
    id: piper_leader
    # 干预动作必须落在阶段 1 数据集的绝对关节角空间里。get_action() 返回的是
    # 相对标定 neutral 的偏移，除非主臂 neutral 就是跟随臂零位，否则会给 BC 项
    # 引入系统性偏置 —— 所以默认读绝对值。
    use_calibrated_offsets: false
    # 接管瞬间主从关节差的上限。主臂在两次干预之间一直保持跟随臂位姿，差得多说明
    # 人在主臂泄力时把它挪走了，此时释放会让跟随臂去追主臂。0 表示不检查。
    max_takeover_delta_rad: 0.15
    # align() 发的是异步 JointCtrl、不等到位；不等它落定就量主从差，会把一个
    # 已经不存在的偏差判成"主臂被挪走了"。这段等待跑在后台线程上，不占操作员时间。
    align_settle_s: 1.0
    # 存进 buffer 的人类动作：leader = 主臂位姿，issued = 从臂实际执行的限速后指令。
    # 只有限速饱和（人比 max_joint_vel_rad_s 还快）时两者才有差别。
    action_source: leader

rl:
  ac:
    chunk_len: 10
    action_dim: 7                   # 6 关节 + 夹爪开度
    proprio_dim: 14
    hidden_dim: 256
    n_layers: 2
    action_std: 0.05
    ref_dropout: 0.5
  discount: 0.99
  # openpi-RLT 的 actor loss：bc_w * mean((a - bc_target)^2) - q_w * mean(Q1)。
  # BC 项是 C*d 上的均值，所以这几个权重比 sum 口径的 beta 大约 C*d 倍。
  # 数值取自 openpi-RLT 实机任务 configs/tasks/agilex_ethernet/online_rl.yaml。
  warmup_bc_weight: 10.0
  warmup_q_weight: 0.1
  online_bc_weight: 5.0
  online_q_weight: 0.1
  utd: 5
  batch_size: 256
  warmup_env_steps: 2000
  total_env_steps: 50000
  buffer_capacity: 200000

keyboard_backend: auto

view:
  enabled: true
  # 重绘走在人类回路里（notify_step -> cv2），别每步都画。
  min_period_s: 0.05

wandb:
  enable: true
  project: lerobot_rlt
  # run_name: null            # 默认用 wandb 自动生成的名字
  # run_id: null              # 填上旧 run id 可以把中断的训练续到同一条曲线
  mode: online                # online | offline | disabled
  # 每多少个梯度步跑一次诊断探针（额外几次 critic 前向）。曲线的价值主要来自它们，
  # 但不是免费的，所以走比 loss 更慢的时钟。
  diagnostics_every: 100

critical_phase: true
resume_buffer: null
log_freq: 200
save_freq: 1000
