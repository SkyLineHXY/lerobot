# 遥操作链路验证（上机第 0 步）—— 不训练、不加载 VLA、不写数据集
#
# 目的：在跑 train_online.py 之前，单独确认
#   1) 重力补偿主臂 -> 跟随臂这条链路能不能稳定跑到 control_hz
#   2) 键名映射 / 限速 / 按键语义 / 主从对齐这套流程是不是对的
#
# 建议顺序：
#   a) 先 dry-run，只读不下发，确认主臂读数正常、耗时在预算内
#        python -m lerobot.rlt.teleop_check --config_path examples/rlt/piper/teleop_check.yaml \
#          --dry_run=true
#   b) 关掉相机，单独看机械臂 CAN 链路的极限
#        ... --use_cameras=false
#   c) 打开相机做真实跟随（本文件默认），按空格握住主臂拖动 20~30 秒
#   d) 带上阶段 1 输出，连带验证归一化边界
#        ... --rl_token=outputs/rl_token
#
# 操作员按键（与 train_online.py 完全一致）：
#   空格 握住/交还主臂   s 成功   f 失败   ← 打标记   Esc 结束

can_port: can_left_f

leader:
  port: can_left_l
  id: piper_leader
  use_calibrated_offsets: false
  require_calibration: false
  max_takeover_delta_rad: 0.15

  # ---- 重力补偿 ----
  gravity_comp_tx_ratio: [0.55, 0.95, 1.02, 1.2, 1.2, 0.5]
  gravity_comp_base_rpy_deg: [0.0, 0.0, 0.0]
  gravity_comp_torque_limit: 8.0
  gravity_comp_mit_kp: 0.0
  gravity_comp_mit_kd: 0.0
  gravity_comp_control_hz: 200.0
  gravity_comp_urdf: assets/piper_description/urdf/piper_description.urdf
  gravity_comp_payload_mass: 0.0
  gravity_comp_payload_com: [0.0, 0.0, 0.0]

control_hz: 30.0
duration_s: 60.0
max_joint_step_rad: 1.0

use_cameras: true
cameras: []

keyboard_backend: auto

dry_run: false
engage_on_start: false
align_settle_s: 2.0

# 给了就额外验证「人的关节读数 -> 归一化 -> 反归一化」能否原样回来
rl_token: null
device: cpu

out: outputs/teleop_check
