dataset:
  repo_id: zzq/franka_multicam_demo
  root: /home/zzq/lerobot/datasets/franka_multicam_demo_0516_v1
  single_task: "franka multicam demo"
  fps: 15
  num_episodes: 100
  episode_time_s: 10
  push_to_hub: false

collection:
  max_frames_per_episode: null
  min_frames_before_save: 1
  print_every_n_frames: 30

display_data: false
play_sounds: true
resume: false
