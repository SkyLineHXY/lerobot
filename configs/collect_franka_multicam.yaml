# 用法：
#   python -m lerobot.scripts.lerobot_collect_franka_multicam \
#       --config_path configs/collect_franka_multicam.yaml
#
# 键盘控制：
#   c      开始 / 继续采集当前 episode
#   space  暂停采集
#   s      保存当前 episode
#   r      清除当前未保存缓存帧
#   q      finalize 并退出
robot:
  robot_ip: 192.168.172.134
  robot_port: 4242
teleop:
  type: spacemouse
  use_gripper: true
  use_rotation: true
  position_scale: 0.003
  orientation_scale: 0.02
